services:
  survival:
    build: .
    container_name: survival-server
    ports:
      - "8788:8788"
    environment:
      PORT: 8788
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b
    depends_on:
      - ollama
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    container_name: survival-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
volumes:
  ollama_data: