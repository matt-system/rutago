services:
  survival:
    build: .
    container_name: survival-server
    ports:
      - "8788:8788"
    environment:
      PORT: 8788
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b
      EMBED_MODEL: nomic-embed-text
      QDRANT_URL: http://qdrant:6333
      KIWIX_URL: http://kiwix:8080
      MAPS_URL: http://maps:8080
    depends_on:
      - ollama
      - qdrant
      - kiwix
      - maps
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    container_name: survival-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:latest
    container_name: survival-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    restart: unless-stopped
  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:3.8.2
    container_name: survival-kiwix
    command: ["*.zim"]
    volumes:
      - ./data/zim:/data:ro
    ports:
      - "8081:8080"
    restart: unless-stopped
  maps:
    image: maptiler/tileserver-gl:latest
    container_name: survival-maps
    volumes:
      - ./data/maps:/data:ro
    ports:
      - "8082:8080"
    restart: unless-stopped
volumes:
  ollama_data:
  qdrant_data: