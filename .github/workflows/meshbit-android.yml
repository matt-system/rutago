name: Meshbit Android APK (optimized)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/meshbit-app
    paths:
      - "meshbit/**"
      - ".github/workflows/meshbit-android.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meshbit
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install
      - name: Generate clean native Android project
        run: npx expo prebuild --clean --platform android --non-interactive
      - name: Build optimized arm64 release APK
        working-directory: meshbit/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
      - name: Report APK size
        working-directory: meshbit
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          ls -lh "$APK"
          du -h "$APK"
      - name: Upload optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: meshbit-android-arm64-release-apk
          path: meshbit/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
