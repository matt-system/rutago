name: Meshbit Android APK (optimized)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/meshbit-app
    paths:
      - "meshbit/**"
      - "!meshbit/native/**"

concurrency:
  group: meshbit-legacy-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meshbit
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install
      - name: Typecheck encrypted messaging client
        run: npm run typecheck
      - name: Test encryption primitives
        run: npm run test:crypto
      - name: Generate clean native Android project
        run: npx expo prebuild --clean --platform android --non-interactive
      - name: Build optimized arm64 release APK
        working-directory: meshbit/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
      - name: Report APK size
        working-directory: meshbit
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          ls -lh "$APK"
          du -h "$APK"
      - name: Publish public test release (GitHub Releases, free)
        working-directory: meshbit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: meshbit-test-${{ github.run_number }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          cp "$APK" /tmp/meshbit-android-arm64.apk
          gh release create "$TAG" /tmp/meshbit-android-arm64.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Meshbit Android test build ${{ github.run_number }}" \
            --notes "TEST BUILD ONLY. Meshbit encrypted 1:1 messaging beta; key verification is manual, no Signal-style ratchet, no multi-device recovery, no independent security audit, and Bluetooth mesh is not implemented. Do not use for high-risk communications. Android arm64 only."
      - name: Upload optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: meshbit-android-arm64-release-apk
          path: meshbit/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
