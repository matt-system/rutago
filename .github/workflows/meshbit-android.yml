name: Meshbit Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/meshbit-app
    paths:
      - "meshbit/**"
      - ".github/workflows/meshbit-android.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meshbit
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build installable debug APK
        working-directory: meshbit/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meshbit-android-debug-apk
          path: meshbit/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
