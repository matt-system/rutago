name: Validate RutaGo Preview

on:
  push:
    branches:
      - rutago-preview
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icons/**'
      - '.github/workflows/publish-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rutago-preview-check
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: rutago-preview

      - name: Validate preview files
        run: |
          test -s index.html
          test -s manifest.json
          test -s sw.js
          echo "RutaGo Preview files are present."

      - name: Check JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const start = html.indexOf('<script>', html.indexOf('</script>') + 1);
          const end = html.lastIndexOf('</script>');
          if (start < 0 || end <= start) throw new Error('No inline application script found');
          fs.writeFileSync('/tmp/rutago-app.js', html.slice(start + 8, end));
          NODE
          node --check /tmp/rutago-app.js
