name: Build MESHBIT Native Android
on:
  workflow_dispatch:
  push:
    branches: [ feature/meshbit-app ]
    paths:
      - 'meshbit/native/**'
      - '.github/workflows/meshbit-native-android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate native platform projects
        working-directory: meshbit/native
        run: flutter create --project-name meshbit --org app.meshbit --platforms=android,ios .
      - name: Configure radio permissions
        working-directory: meshbit/native
        run: python3 tool/patch_platform.py
      - name: Resolve packages
        working-directory: meshbit/native
        run: flutter pub get
      - name: Analyze Dart
        working-directory: meshbit/native
        run: flutter analyze
      - name: Run unit tests
        working-directory: meshbit/native
        run: flutter test
      - name: Build release APK
        working-directory: meshbit/native
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: meshbit-native-android-apk
          path: meshbit/native/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
