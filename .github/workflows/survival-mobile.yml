name: Build SURVIVAL mobile apps
on:
  push:
    branches: [survival]
    paths:
      - 'survival/mobile-app/**'
      - 'survival/mesh-plugin/**'
      - 'survival/web/descargar/**'
      - '.github/workflows/survival-mobile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: survival
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: survival/mobile-app/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install BLE plugin dependencies
        working-directory: survival/mobile-app
        run: npm install --prefix ../mesh-plugin
      - name: Install dependencies
        working-directory: survival/mobile-app
        run: npm install
      - name: TypeScript and web build
        working-directory: survival/mobile-app
        run: npm run build
      - name: Generate Android project and sync BLE plugin
        working-directory: survival/mobile-app
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: survival/mobile-app/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: survival-android-debug
          path: survival/mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish-android:
    runs-on: ubuntu-latest
    needs: android
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: survival-android-debug
          path: release
      - name: Publish stable APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: survival-android-latest
          name: SURVIVAL Android — última versión
          body: |
            Descarga oficial de SURVIVAL para Android.
            APK de prueba. Consulta la página oficial de descarga para instrucciones y limitaciones.
          files: release/app-debug.apk
          overwrite_files: true
          make_latest: false

  ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: survival
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: survival/mobile-app/package.json
      - name: Install BLE plugin dependencies
        working-directory: survival/mobile-app
        run: npm install --prefix ../mesh-plugin
      - name: Install dependencies
        working-directory: survival/mobile-app
        run: npm install
      - name: TypeScript and web build
        working-directory: survival/mobile-app
        run: npm run build
      - name: Generate iOS project and sync BLE plugin
        working-directory: survival/mobile-app
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Add Bluetooth privacy descriptions
        working-directory: survival/mobile-app
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string 'SURVIVAL usa Bluetooth para enviar mensajes directamente a teléfonos cercanos, sin Internet.'" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string 'SURVIVAL permite que otros teléfonos cercanos se conecten para intercambiar mensajes offline.'" ios/App/App/Info.plist
      - name: Build iOS Simulator app
        working-directory: survival/mobile-app
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
